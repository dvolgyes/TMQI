---
image:
  - Visual Studio 2022

platform:
  - x64

install:
  - ps: irm https://astral.sh/uv/install.ps1 | iex
  - set PATH=%USERPROFILE%\.local\bin;%PATH%
  # --managed-python: AppVeyor's ambient `C:\PythonXXX` (no `-x64` suffix) is the 32-bit
  # build; scipy/scikit-image ship no win32 wheels, so picking it up forces a source
  # build that fails (no Windows C/Fortran toolchain configured here). Forcing uv's own
  # managed Python (always 64-bit on Windows, pinned via .python-version) sidesteps the
  # ambient-interpreter bitness ambiguity entirely rather than guessing AppVeyor's image
  # layout.
  - uv sync --locked --group dev --managed-python

# uv manages its own Python install per requires-python (pyproject.toml); no MSBuild/VS
# project exists in this repo, so the build phase must be disabled explicitly.
build: off

test_script:
  - uv run pytest -n 8 --cov -v
