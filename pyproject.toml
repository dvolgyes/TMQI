[project]
name = "tmqi-revised"
version = "1.0.0"
description = "Tone Mapped Image Quality Index - revised"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [{ name = "David Völgyes", email = "david.volgyes@ieee.org" }]
keywords = ["HDR", "TMQI", "image quality", "metrics", "tone-mapping"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "click>=8.5.0,<9.0",
  "imageio>=2.37.4,<3.0",
  "loguru>=0.7.3,<1.0",
  # numpy/scipy/scikit-image: the newest release in each still compatible with
  # requires-python (>=3.10) -- numpy==2.5.2, scipy==1.18.1, and scikit-image==0.26.0
  # (the versions actually installed under Python 3.13) all require Python>=3.11/3.12.
  "numpy>=2.0.0,<3.0",
  "scikit-image>=0.25.2,<1.0",
  "scipy>=1.15.3,<2.0",
]

[project.urls]
Homepage = "https://github.com/dvolgyes/TMQI"
Repository = "https://github.com/dvolgyes/TMQI"
Upstream = "https://ece.uwaterloo.ca/~z70wang/research/tmqi/"

[project.scripts]
tmqi = "tmqi.cli:main"

[dependency-groups]
dev = [
  "coverage>=7",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3",
  "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.coverage.run]
source_pkgs = ["tmqi"]
branch = true
parallel = true

[tool.coverage.paths]
source = ["src/tmqi", "*/site-packages/tmqi"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["slow: full-resolution metric runs (several seconds)"]
minversion = "8.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N", "PTH", "RUF", "ARG"]

[tool.ruff.lint.per-file-ignores]
# metric.py's identifiers (Q, S, N, L_hdr, _RGBtoY, ...) intentionally mirror the paper's
# notation and the reference Matlab implementation; kept as-is, not renamed to snake_case.
"src/tmqi/metric.py" = ["N801", "N802", "N803", "N806", "ARG002"]
"src/tmqi/cli.py" = ["N803", "N806"]
"tests/**" = ["PLR2004", "N806", "SIM300"]

[tool.uv.build-backend]
module-name = "tmqi"
module-root = "src"
