[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project]
name = "tmqi-revised"
version = "1.0.0"
description = "Tone Mapped Image Quality Index - revised"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [{ name = "David Völgyes", email = "david.volgyes@ieee.org" }]
keywords = ["tone-mapping", "image quality", "metrics", "HDR", "TMQI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-image>=0.21",
    "imageio>=2.31",
    "pillow>=10.0",
    "click>=8.1",
    "loguru>=0.7",
]

[project.urls]
Homepage = "https://github.com/dvolgyes/TMQI"
Repository = "https://github.com/dvolgyes/TMQI"
Upstream = "https://ece.uwaterloo.ca/~z70wang/research/tmqi/"

[project.scripts]
tmqi = "TMQI.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "coverage>=7",
    "ruff>=0.8",
    "pre-commit>=4",
]

[tool.uv.build-backend]
module-name = "TMQI"
module-root = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["slow: full-resolution metric runs (several seconds)"]
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["TMQI"]
branch = true
parallel = true

[tool.coverage.paths]
source = ["src/TMQI", "*/site-packages/TMQI"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N", "PTH", "RUF", "ARG"]
# N999: the package is named "TMQI" (capitalized) for backward compatibility with the
# documented `from TMQI import TMQI, TMQIr` API.
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"src/TMQI/metric.py" = ["N801", "N802", "N803", "N806", "ARG002"]
"src/TMQI/cli.py" = ["N803", "N806"]
"tests/**" = ["PLR2004", "N806", "SIM300"]
